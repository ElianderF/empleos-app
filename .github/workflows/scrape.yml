name: Scrape de empleos

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Test conectividad
        run: |
          echo "=== Remotive ==="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://remotive.com/api/remote-jobs?limit=1" || echo "FALLO"
          echo "=== RemoteOK ==="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://remoteok.com/api" || echo "FALLO"
          echo "=== Supabase ==="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "${{ secrets.SUPABASE_URL }}/rest/v1/" || echo "FALLO"

      - name: Ejecutar el scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper/main.py